apply plugin: 'com.android.library'
if(uploadJitpack.toBoolean()){
    apply plugin: 'maven-publish'//this
//    group='com.github.kellysong'//this
}


android {
    compileSdkVersion rootProject.ext.android.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.android.minSdkVersion
        targetSdkVersion rootProject.ext.android.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        //对外：把规则打进 AAR 的 proguard.txt，任何使用方 App 编译时自动合并应用（无论 debug/release
        consumerProguardFiles  'proguard-rules.pro'
    }

    buildTypes {

        release {
            minifyEnabled false
            //对内：库模块自己打包发布时，是否混淆自己的代码
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

}

afterEvaluate {
    publishing {
        publications {
            group= 'com.github.kellysong'
            version = '3.0.0'
            release(MavenPublication) {
                from components.release
                groupId = group
                artifactId = 'base-core'
                version = version

            }
        }
    }
}


dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    //android官方androidx库
    api rootProject.ext.dependencies.appcompat
    api rootProject.ext.dependencies.design
    api rootProject.ext.dependencies.recyclerview
    api rootProject.ext.dependencies.cardview
    api rootProject.ext.dependencies.viewpager
    api rootProject.ext.dependencies.swiperefreshlayout
    api rootProject.ext.dependencies.constraintLayout

    //retrofit + okHttp3,retrofit是一款类型安全的网络框架，基于HTTP协议，服务于Android和java语言,集成了okhttp依赖
    api rootProject.ext.dependencies.retrofit
    api rootProject.ext.dependencies.converterGson
    api rootProject.ext.dependencies.adapterRxjava2

    api rootProject.ext.dependencies.loggingInterceptor
    //rxjava
    api rootProject.ext.dependencies.rxjava
    api rootProject.ext.dependencies.rxandroid

    //AutoDispose解决RxJava内存泄漏,1.0.0安卓支持包改成了androidx
    api rootProject.ext.dependencies.autodispose

    //EventBus是一款本地组件间通信框架
    api rootProject.ext.dependencies.eventbus

    //图片加载
    api rootProject.ext.dependencies.glide
    annotationProcessor rootProject.ext.annotationProcessor.glide

    //强大的BaseRecyclerView适配器
    api rootProject.ext.dependencies.baseRecyclerViewAdapterHelper

    //下面两个不再变

    //控件注解框架,特别注意要在主工程下添加
    api 'com.jakewharton:butterknife:10.2.1'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.1'


}

